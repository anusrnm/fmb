<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FMB Studio</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button id="mobile-menu-toggle" class="icon-btn mobile-only" type="button" aria-expanded="false" aria-controls="tool-menu" title="Open tools">
            <span class="icon">☰</span>
          </button>
          <div class="brand-wrap">
            <h1>FMB Studio</h1>
            <span id="version-badge" class="version-badge"></span>
          </div>
        </div>

        <nav id="tool-menu" class="tool-menu" aria-label="Drawing tools">
          <button class="tool-btn active" data-mode="select" type="button" title="Select">
            <span class="icon">↖</span>
            <span class="label">Select</span>
          </button>
          <button class="tool-btn" data-mode="box-select" type="button" title="Box Select">
            <span class="icon">▭</span>
            <span class="label">Box</span>
          </button>
          <button class="tool-btn" data-mode="point" type="button" title="Point">
            <span class="icon">●</span>
            <span class="label">Point</span>
          </button>
          <button class="tool-btn" data-mode="midpoint" type="button" title="Mid Point">
            <span class="icon">◎</span>
            <span class="label">Mid</span>
          </button>
          <button class="tool-btn" data-mode="segment" type="button" title="Segment">
            <span class="icon">／</span>
            <span class="label">Segment</span>
          </button>
          <button class="tool-btn" data-mode="parallel" type="button" title="Parallel">
            <span class="icon">∥</span>
            <span class="label">Parallel</span>
          </button>
          <button class="tool-btn" data-mode="perpendicular" type="button" title="Perpendicular">
            <span class="icon">⟂</span>
            <span class="label">Perp</span>
          </button>
          <button class="tool-btn" data-mode="polygon" type="button" title="Polygon">
            <span class="icon">⬠</span>
            <span class="label">Polygon</span>
          </button>
          <button class="tool-btn" data-mode="text" type="button" title="Text">
            <span class="icon">T</span>
            <span class="label">Text</span>
          </button>
        </nav>

        <div class="topbar-right">
          <button id="undo-btn" class="icon-btn" type="button" title="Undo (Ctrl+Z)">
            <span class="icon">↶</span>
          </button>
          <button id="redo-btn" class="icon-btn" type="button" title="Redo (Ctrl+Y)">
            <span class="icon">↷</span>
          </button>
          <button id="zoom-out-btn" class="icon-btn" type="button" title="Zoom out">
            <span class="icon">-</span>
          </button>
          <button id="zoom-in-btn" class="icon-btn" type="button" title="Zoom in">
            <span class="icon">+</span>
          </button>
          <button id="zoom-reset-btn" class="icon-btn" type="button" title="Reset zoom and position">
            <span class="icon">100%</span>
          </button>
          <button id="export-json-btn" class="icon-btn" type="button" title="Export JSON">
            <span class="icon">⇩J</span>
          </button>
          <button id="export-svg-btn" class="icon-btn" type="button" title="Export SVG">
            <span class="icon">⇩S</span>
          </button>
          <button id="import-btn" class="icon-btn" type="button" title="Import JSON or SVG">
            <span class="icon">⇧</span>
          </button>
          <button id="theme-toggle-btn" class="icon-btn" type="button" title="Toggle theme">
            <span class="icon">◐</span>
          </button>
          <button id="settings-btn" class="icon-btn settings-btn" type="button" title="Settings">
            <span class="icon">⚙</span>
          </button>
          <input id="import-file" type="file" accept=".json,.svg" hidden />
        </div>
      </header>

      <main class="workspace">
        <section class="graph-panel" aria-label="Graph editor">
          <svg id="graph" viewBox="0 0 1600 900" role="img" aria-label="Interactive graph"></svg>
          <input id="inline-text-editor" class="inline-text-editor" type="text" maxlength="140" hidden aria-label="Inline text editor" />
          <div id="status" class="status-pill" role="status" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div id="settings-panel" class="settings-panel" hidden>
      <h2>Settings</h2>
      <p>This is a placeholder for less frequently used settings.</p>
      <label class="toggle-row">
        <input id="snap-toggle" type="checkbox" checked />
        <span>Snap to nearby points while drawing</span>
      </label>
      <button id="close-settings-btn" type="button">Close</button>
    </div>

    <div id="context-menu" class="context-menu" hidden>
      <button id="view-points-btn" type="button">View / Copy Coordinates</button>
      <button id="join-points-btn" type="button">Join Selected Points</button>
    </div>

    <dialog id="points-dialog" class="points-dialog">
      <form method="dialog">
        <h3>Diagram Coordinates</h3>
        <p>Right click anywhere on the graph to open this list quickly.</p>
        <textarea id="points-output" rows="12" readonly></textarea>
        <div class="dialog-actions">
          <button id="copy-points-btn" value="copy" type="button">Copy</button>
          <button value="close" type="submit">Close</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./app.js?v=ui2"></script>
  </body>
</html>
