<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FMB Generator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <button id="theme-toggle" type="button" aria-label="Toggle dark theme">🌙 Dark</button>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-top">
          <p class="eyebrow">FMB web app</p>
          <p class="subtitle">
            Enter point coordinates in a natural format, inspect the plot, and calculate
            property area in multiple units.
          </p>
        </div>

        <div class="action-row">
          <button id="add-text-btn" type="button">Add text</button>
        </div>

        <div class="compact-row">
          <label class="checkbox-row">
            <input id="show-points" type="checkbox" checked />
            <span>Show points</span>
          </label>
          <label class="checkbox-row">
            <input id="show-gridlines" type="checkbox" checked />
            <span>Gridlines</span>
          </label>
          <label class="checkbox-row">
            <input id="show-labels" type="checkbox" checked />
            <span>Labels</span>
          </label>
          <label class="checkbox-row">
            <input id="show-angle-arcs" type="checkbox" checked />
            <span>Angle arcs</span>
          </label>
          <label class="checkbox-row">
            <input id="show-segments" type="checkbox" checked />
            <span>Segments</span>
          </label>
        </div>

        <div class="control-group">
          <span class="control-label">Plot colors</span>
          <div class="color-grid">
            <label>Boundary <input id="color-boundary" type="color" /></label>
            <label>Points <input id="color-point" type="color" /></label>
            <label>Labels <input id="color-label" type="color" /></label>
            <label>Segments <input id="color-segment" type="color" /></label>
            <label>Arcs <input id="color-arc" type="color" /></label>
            <button id="reset-colors-btn" type="button">Reset colors</button>
          </div>
        </div>

        <div class="control-group">
          <label for="text-size">Selected text size <output id="text-size-value" for="text-size">16 px</output></label>
          <input id="text-size" type="range" min="10" max="48" value="16" />
        </div>

        <div class="control-group">
          <label for="points-input">Points</label>
          <textarea id="points-input" rows="5"></textarea>
        </div>

        <div class="control-group">
          <label for="joins-input">Segments</label>
          <textarea id="joins-input" rows="5" placeholder="Segment point 1, 0, 0&#10;Segment point 2, 80, -35"></textarea>
        </div>

        <div class="action-row">
          <button id="export-btn" type="button">Export SVG</button>
          <button id="import-btn" type="button">Import SVG</button>
          <button id="save-graph-btn" type="button">Save Graph</button>
        </div>
        <div class="action-row">
          <button id="create-segment-btn" type="button">Create segment</button>
          <button id="undo-btn" type="button">Undo</button>
          <button id="redo-btn" type="button">Redo</button>
        </div>
        <input id="import-file" type="file" accept=".svg,.json" hidden />

        <div id="warnings" class="warnings" aria-live="polite"></div>
        <div id="status-message" class="status-message" role="status"></div>
      </aside>

      <main class="main-panel">
        <div class="plot-card">
          <svg id="plot" viewBox="0 0 800 500" role="img" aria-label="Property plot"></svg>
        </div>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
